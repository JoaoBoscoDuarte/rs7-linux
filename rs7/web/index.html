<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RS7 Linux</title>
<link rel="stylesheet" href="app.css">
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
</head><body>
<div class="bg"></div>
<header>
  <div class="brand"><svg viewBox="0 0 24 24" width="26" height="26"><rect x="6" y="2" width="12" height="20" rx="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v7M6 9h12" stroke="currentColor" stroke-width="1.8"/></svg><b>RS7 <span>Linux</span></b></div>
  <div class="profiles" id="profbar" role="tablist"></div>
  <span class="sp"></span>
  <span class="chip" id="bat">—</span><span class="chip" id="fw">—</span>
</header>
<div id="err" class="card center"><h2 data-i18n="err.title"></h2><p id="errmsg"></p><button class="pri" onclick="load()" data-i18n="err.retry"></button></div>
<div id="app">
<nav id="tabs"></nav>
<main>
<section id="t-home"><div class="card"><h2 data-i18n="home.title"></h2><p data-i18n="home.sub"></p>
<div class="home">
<div class="mousebox big"><div id="m3d" class="m3d"></div><div id="hwrap" class="mouse2d"></div>
<div class="viewbar" id="viewbar" style="display:none"><button class="sec" onclick="toggle3d()" id="v3d"></button><button class="sec" id="vreset" style="display:none" onclick="Mouse3D&&Mouse3D.resetView()" data-i18n="home.resetview"></button><label class="auto" id="vauto" style="display:none"><input type="checkbox" onchange="Mouse3D&&Mouse3D.autoRotate(this.checked)"> <span data-i18n="home.autorot"></span></label></div>
<p class="warn tip3d" id="fail3d" style="display:none"></p><p class="warn tip3d" id="tip3d" style="display:none" data-i18n="home.dragtip"></p><p class="warn tip3d" id="feedhint" style="display:none" data-i18n="home.feedhint"></p>
<div class="counts" id="counts"></div><button class="sec" onclick="homeReset()" data-i18n="home.reset"></button></div>
<div class="padwrap"><canvas id="pad" width="420" height="420"></canvas>
<div class="stats"><div><span data-i18n="home.pos"></span><b id="spos">–</b></div><div><span data-i18n="home.delta"></span><b id="sdelta">–</b></div><div><span data-i18n="home.speed"></span><b id="sspeed">–</b></div><div><span data-i18n="home.rate"></span><b id="srate">–</b></div></div>
<p class="warn" data-i18n="home.hint"></p></div></div></div></section>

<section id="t-buttons"><div class="card"><h2 data-i18n="btn.title"></h2><p data-i18n="btn.sub"></p>
<div class="mouse"><div class="mousebox"><div id="bwrap" class="mouse2d pick"></div></div>
<div class="form"><div class="row"><label data-i18n="btn.button"></label><b id="bname"></b></div>
<div class="row"><label data-i18n="btn.action"></label><select id="atype"></select></div>
<div class="row" id="rmouse"><label data-i18n="btn.mouse"></label><select id="amouse"></select></div>
<div class="row" id="rkey"><label data-i18n="btn.key"></label><select id="akey"></select></div>
<div class="row mods" id="rmods"><label data-i18n="btn.mods"></label><span id="mods"></span></div>
<div class="row" id="rmedia"><label data-i18n="btn.media"></label><select id="amedia"></select></div>
<div class="row" id="rmacro"><label data-i18n="btn.macro"></label><select id="amacro"></select><select id="mmode"></select><input type="number" id="mcount" min="1" max="255" value="1" style="width:70px"></div>
<div class="row"><button class="pri" onclick="applyKeys()" data-i18n="btn.apply"></button><button class="sec" onclick="resetKeys()" data-i18n="btn.reset"></button></div>
<p class="warn" data-i18n="btn.warn"></p></div></div></div></section>

<section id="t-dpi"><div class="card"><h2 data-i18n="dpi.title"></h2><p data-i18n="dpi.sub"></p><div id="dpis"></div>
<div class="row"><label data-i18n="dpi.count"></label><select id="dcount"></select></div><div class="row"><button class="pri" onclick="applyDpi()" data-i18n="apply"></button></div></div></section>

<section id="t-perf"><div class="card"><h2 data-i18n="perf.title"></h2><p data-i18n="perf.sub"></p>
<div class="row"><label data-i18n="perf.rate"></label><select id="rate"></select><span class="warn" data-i18n="perf.ratewarn"></span></div>
<div class="row"><label data-i18n="perf.lod"></label><div class="seg" id="lod"></div></div>
<div class="row"><label data-i18n="perf.deb"></label><input type="number" id="deb" min="0" max="20"></div>
<div class="row"><label data-i18n="perf.sleep"></label><select id="sleep"></select></div>
<div class="row"><label data-i18n="perf.scroll"></label><div class="seg" id="scroll"></div></div>
<div class="row"><label data-i18n="perf.esports"></label><input type="checkbox" id="esp"><span class="warn" data-i18n="perf.espwarn"></span></div>
<div class="row"><label data-i18n="perf.sensor"></label><span class="checks"><label><input type="checkbox" data-s="ripple"> <span data-i18n="perf.ripple"></span></label> <label><input type="checkbox" data-s="angle_snap"> <span data-i18n="perf.angle"></span></label> <label><input type="checkbox" data-s="motion_sync"> <span data-i18n="perf.sync"></span></label></span></div>
<div class="row"><button class="pri" onclick="applyPerf()" data-i18n="apply"></button></div></div></section>

<section id="t-macro"><div class="card"><h2 data-i18n="mac.title"></h2><p data-i18n="mac.sub"></p>
<div class="row"><label data-i18n="mac.macro"></label><select id="mlist"></select><button class="sec" onclick="mNew()" data-i18n="mac.new"></button><button class="sec" onclick="mDel()" data-i18n="mac.del"></button></div>
<div class="row"><label data-i18n="mac.name"></label><input id="mname" maxlength="40"></div>
<div class="row"><label data-i18n="mac.record"></label><button class="sec" id="rec" onclick="mRec()"></button><span class="warn" data-i18n="mac.recwarn"></span></div>
<table id="evs"></table>
<div class="row"><button class="sec" onclick="mAdd()" data-i18n="mac.tap"></button><button class="sec" onclick="mClear()" data-i18n="mac.clear"></button><button class="pri" onclick="mSave()" data-i18n="mac.save"></button></div></div></section>

<section id="t-light"><div class="card"><h2 data-i18n="light.title"></h2><p data-i18n="light.sub"></p><div class="seg" id="light"></div></div></section>

<section id="t-settings"><div class="card"><h2 data-i18n="set.title"></h2>
<div class="row"><label data-i18n="set.lang"></label><select id="slang"></select></div>
<div class="row"><label data-i18n="set.theme"></label><select id="stheme"></select></div>
<div class="row"><label data-i18n="set.tray"></label><input type="checkbox" id="stray"><span class="warn" data-i18n="set.traywarn"></span></div>
<p class="warn" id="trayhint" style="display:none" data-i18n="set.trayhint"></p></div></section>

<section id="t-about"><div class="card about"><h2>RS7 Linux <small id="ver"></small></h2><p data-i18n="about.desc"></p>
<div class="links"><a class="pri lnk" href="https://github.com/JoaoBoscoDuarte/rs7-linux" target="_blank" rel="noopener">GitHub · rs7-linux</a>
<a class="sec lnk" href="https://github.com/JoaoBoscoDuarte" target="_blank" rel="noopener" data-i18n="about.author"></a>
<a class="sec lnk" href="https://github.com/JoaoBoscoDuarte/rs7-linux/issues" target="_blank" rel="noopener" data-i18n="about.issues"></a>
<a class="sec lnk" href="https://github.com/JoaoBoscoDuarte/rs7-linux/releases" target="_blank" rel="noopener">Releases</a></div>
<p class="warn" data-i18n="about.legal"></p></div></section>
</main></div>
<footer><span>© 2025–2026 <a href="https://github.com/JoaoBoscoDuarte" target="_blank" rel="noopener">João Bosco Duarte</a></span><span>·</span><a href="https://github.com/JoaoBoscoDuarte/rs7-linux" target="_blank" rel="noopener">rs7-linux</a><span>·</span><span id="fver"></span><span>·</span><span data-i18n="foot.unofficial"></span></footer>
<dialog id="dlg"><form method="dialog"><h3 id="dtitle"></h3><input id="dinput" maxlength="40" autocomplete="off"><div class="row"><button class="sec" value="cancel" data-i18n="cancel"></button><button class="pri" value="ok" id="dok" data-i18n="ok"></button></div></form></dialog>
<div id="toast"></div>
<script src="i18n.js"></script><script src="app.js"></script><script type="module" src="mouse3d.js"></script>
</body></html>
